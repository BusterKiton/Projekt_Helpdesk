<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script>
        const ticketId = "{{ ticket_id }}";
        const ws = new WebSocket(`ws://127.0.0.1:8000/ws/chat/${ticketId}/`);

        ws.onmessage = function(event) {
            const message = JSON.parse(event.data);
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<p><strong>${message.sender}:</strong> ${message.text}</p>`;
        };

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value;
            ws.send(JSON.stringify({ text: message }));
            input.value = '';
        }
    </script>
</head>
<body>
    <h1>Chat for Ticket #{{ ticket_id }}</h1>
    <div id="chat-box" style="border: 1px solid #000; padding: 10px; height: 300px; overflow-y: scroll;"></div>
    <input id="message-input" type="text" placeholder="Type your message...">
    <button onclick="sendMessage()">Send</button>
</body>
</html>
